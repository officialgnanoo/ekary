<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وكالة العكيري</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="وكالة العكيري">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b3d91;--bg2:#08296b;--card:#fff;--ink:#12213f;--mut:#5b6b8c;--ok:#1b8a4b;--bad:#c62828;--wa:#128c4a;--line:#dbe4f5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,sans-serif;font-size:19px;color:var(--ink);min-height:100vh;
background:
radial-gradient(circle at 8% 12%,rgba(255,255,255,.10) 0 26px,transparent 27px),
radial-gradient(circle at 88% 20%,rgba(255,255,255,.08) 0 44px,transparent 45px),
radial-gradient(circle at 20% 60%,rgba(255,255,255,.07) 0 16px,transparent 17px),
radial-gradient(circle at 75% 70%,rgba(255,255,255,.09) 0 30px,transparent 31px),
radial-gradient(circle at 45% 90%,rgba(255,255,255,.07) 0 52px,transparent 53px),
radial-gradient(circle at 60% 8%,rgba(255,255,255,.06) 0 14px,transparent 15px),
linear-gradient(160deg,var(--bg),var(--bg2)) fixed}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
header{text-align:center;color:#fff;padding:22px 0 18px}
h1{font-family:'Reem Kufi',serif;font-size:clamp(46px,11vw,72px);margin:0;line-height:1.15;letter-spacing:.5px}
header p{margin:6px 0 0;font-size:20px;opacity:.85}
@keyframes rise{from{opacity:0}to{opacity:1}}
@keyframes glow{from{text-shadow:0 0 6px rgba(255,255,255,.15),0 0 14px rgba(120,170,255,.2)}to{text-shadow:0 0 14px rgba(255,255,255,.75),0 0 36px rgba(120,170,255,.8)}}
header h1{animation:rise 2s ease both,glow 4s ease-in-out 2s infinite alternate}
header p{animation:rise 2.6s ease both,glow 4s ease-in-out 2.6s infinite alternate}
.who{color:#fff;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap;font-size:14px;margin-bottom:14px}
.lo{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.75);border-radius:20px;padding:4px 12px;font-weight:700;cursor:pointer}
.lo:hover{background:#fff;color:var(--bg)}
[hidden]{display:none!important}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 22px}
button,select,input{font-family:inherit;font-size:inherit}
.bb{background:#fff;color:var(--bg);border:0;border-radius:18px;padding:20px 6px;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bb span{font-size:34px;display:block;line-height:1}
.bb:active{transform:translateY(2px);box-shadow:none}
h2{color:#fff;font-size:24px;margin:26px 4px 10px}
.sec-btn{display:block;width:100%;text-align:center;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:16px;padding:12px;font-size:20px;font-weight:900;cursor:pointer;margin:26px 0 10px}
.sec-btn:hover{background:rgba(255,255,255,.2)}
.card.trashed{border-inline-start:6px solid var(--mut);opacity:.9}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(3,20,70,.28)}
.card.open{border-inline-start:6px solid #f0a30a}.card.done{border-inline-start:6px solid var(--ok)}
header p::after{content:"";display:block;width:70px;height:3px;background:rgba(255,255,255,.5);border-radius:3px;margin:12px auto 0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top b{font-size:22px}
.act{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.nm{font-size:22px;font-weight:900;color:var(--bg);min-width:0;overflow-wrap:anywhere}
.nmbox{display:inline-flex;align-items:center;gap:12px;max-width:100%;border:2px solid var(--line);background:#f3f7ff;border-radius:14px;padding:6px 14px}
.nmbox .pb{width:36px;height:36px}
.nmbox .pb svg{width:20px;height:20px}
.no{display:table;margin:0 auto 10px;background:var(--bg);color:#fff;font-weight:700;font-size:15px;padding:2px 16px;border-radius:14px}
.top2{display:flex;justify-content:center;margin-bottom:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
.cont{display:flex;gap:8px}
.it{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;margin-bottom:6px;font-size:17px}
.it .c{border:1.5px solid var(--line);background:#f8faff;border-radius:0;padding:6px 10px;text-align:center;white-space:nowrap;font-weight:700}
.it .c:first-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.it .c.t{background:var(--bg);border-color:var(--bg);color:#fff;font-weight:900}
.ur{display:contents}
#ul{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,max-content) max-content 34px;gap:8px 6px;align-items:center;justify-content:center;margin-bottom:10px;font-size:16px}
.ur .c{border:1.5px solid var(--line);background:#f8faff;padding:6px 10px;white-space:nowrap;font-weight:700;text-align:center}
.ur .n{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--bg)}
.ur .u{direction:ltr;font-weight:400}
.ur .m{background:var(--bg);border-color:var(--bg);color:#fff}
.ur .sp{width:34px;flex:none}
.ib{position:relative;padding:0;-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ib svg,.row .x svg{position:absolute;top:50%;left:50%;display:block;fill:#fff;pointer-events:none;width:18px;height:18px;margin:-9px 0 0 -9px}
.ib.d{background:var(--bad)}.ib.e{background:#e08a00}.ib.o{background:var(--ok)}
.pb{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pb svg{width:22px;height:22px;fill:#fff}
.pb.c{background:var(--bg)}.pb.w{background:#25D366}
.ln{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0;font-size:18px}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:21px;padding-top:8px}
.mut{color:var(--mut);font-size:16px;margin-top:6px;text-align:center}
.paid{color:var(--ok);font-weight:700;text-align:center;margin-top:4px}
.empty{color:#fff;opacity:.75;text-align:center;padding:14px}
.ov{position:fixed;inset:0;background:rgba(5,20,60,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:10}
.md{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:20px;margin:auto}
.md h3{margin:0 0 12px;font-size:24px;color:var(--bg)}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:17px}
input,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid #7aa7ff;border-color:var(--bg)}
.row{display:grid;grid-template-columns:1.5fr .8fr 1fr 1fr 40px;gap:8px;align-items:end;background:#f3f7ff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.row label{margin:0 0 3px;font-size:15px;text-align:center}
.row input,.row select{text-align:center;text-align-last:center;padding:0 4px;height:50px}
.xw{align-self:end;height:50px;display:flex;align-items:center;justify-content:center}
.ft{grid-column:1/-1;position:relative;display:flex;align-items:center;justify-content:center;min-height:40px}
.lt{font-size:19px;font-weight:900;color:var(--bg)}
.row .x{position:relative;padding:0;-webkit-appearance:none;appearance:none;margin:0;width:40px;height:40px;border:0;border-radius:50%;background:var(--bad);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.row .x svg{width:20px;height:20px;margin:-10px 0 0 -10px}
.chip{border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);border-radius:20px;padding:4px 12px;font-weight:700}
.cd{direction:ltr;text-align:right;background:#f3f7ff;border:2px solid var(--line);border-radius:14px;font-size:36px;font-weight:900;padding:12px 14px;min-height:66px;overflow-x:auto;color:var(--bg);margin-bottom:12px}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck button{padding:16px 0;font-size:26px;font-weight:900;border:0;border-radius:14px;background:#e5ecfa;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.ck button:active{transform:translateY(2px);box-shadow:none}
.ck .op{background:var(--bg);color:#fff}.ck .eq{background:var(--ok);color:#fff;grid-row:span 2}.ck .z{grid-column:span 2}.ck .cl{background:var(--bad);color:#fff}
.add{width:100%;border:2px dashed var(--bg);background:#fff;color:var(--bg);border-radius:12px;padding:12px;font-weight:900;font-size:19px;cursor:pointer;margin:4px 0 8px}
.gt{font-size:24px;font-weight:900;text-align:center;color:var(--bg);margin:10px 0}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;padding:14px;border:0;border-radius:14px;font-weight:900;font-size:20px;cursor:pointer}
.sv{background:var(--bg);color:#fff}.cn{background:#e5ecfa;color:var(--ink)}
.err{color:var(--bad);font-weight:700;min-height:24px;margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0}
.chk input{width:24px;height:24px}
#login{max-width:440px;margin:0 auto}
#login .card{padding:20px}
.ph{margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:34px}
input[type=date]{width:auto;max-width:100%;display:block;margin:0 auto;text-align:center;padding:10px 14px}
@keyframes fi{from{opacity:0}to{opacity:1}}
.ov{animation:fi .25s ease}.md{animation:fi .35s ease}
.ov.out{opacity:0;transition:opacity .2s ease}
#login,#app{animation:fi .6s ease}
.bb,.ib,.pb,.lo,.sv,.cn,.add,input,select{transition:transform .15s,box-shadow .2s,background .25s,color .25s,border-color .2s}
.pb:hover,.ib:hover{transform:scale(1.1)}
.bb:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){
body{font-size:18px}
.wrap{padding:10px 10px 50px}
.ov{padding:8px}
.md{padding:14px;border-radius:16px}
.bb{font-size:16px;padding:14px 2px}
.bb span svg{width:28px;height:28px}
.card{padding:12px}
.it{font-size:14px;gap:3px}
.it .c{padding:5px 5px}
#ul{font-size:14px;gap:6px 4px}
.ur .c{padding:5px 6px}
.row{grid-template-columns:1fr 1fr}
.ft,.xw{grid-row:3}
.xw{grid-column:2;justify-self:end;height:40px;position:relative;z-index:1}
.ck button{padding:14px 0;font-size:24px}
.btns button{font-size:18px}
.ib{width:34px;height:34px}
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>وكالة العكيري</h1><p>للبذور والبقوليات</p></header>

<div id="login"><div class="card">
<label>اسم المستخدم</label><input id="u" autocomplete="username">
<label>كلمة السر</label><input id="p" type="password" autocomplete="current-password">
<div class="chk"><input type="checkbox" id="rem" checked><label for="rem" style="margin:0">حفظ اسم المستخدم وكلمة السر</label></div>
<div class="btns"><button class="sv" onclick="login()">دخول</button></div>
<div class="err" id="lerr"></div>
</div></div>

<div id="app" hidden>
<div class="who"><span id="me" class="chip"></span><button class="lo" onclick="usersM()" id="ulink" hidden>المستخدمين</button><button class="lo" onclick="logout()">خروج</button></div>
<div class="big">
<button class="bb" onclick="invForm()"><span>+</span>فاتورة جديدة</button>
<button class="bb" onclick="traderForm()"><span>+</span>تاجر جديد</button>
<button class="bb" onclick="calcM()"><span><svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" fill-rule="evenodd"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm1 2v4h12V5H6zm1 6v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2zm-8 4v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg></span>آلة حاسبة</button>
</div>
<h2>فواتير لم تُسدَّد</h2><div id="open"></div>
<button class="sec-btn" onclick="toggleSec('paid')" id="paidBtn">▾ فواتير تم سدادها</button>
<div id="paidWrap" hidden><div id="paid"></div></div>
<button class="sec-btn" onclick="toggleSec('trash')" id="trashBtn">▾ فواتير محذوفة</button>
<div id="trashWrap" hidden><div id="trash"></div></div>
</div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbwqKj0_XxFkPQRVOzdhxYkTU7QVsN_QPlTCAJGAcXIbnBDWPs9ujKg59spE7arawIN5/exec';
const BASE=['فول','عدس','حمص','فاصوليا','عدس بجبة'];let KINDS=BASE.slice();
let S={t:[],i:[],u:[],me:null},cred=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>parseFloat(v)||0;
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const ic=d=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="${d}"/></svg>`;
const IC={ok:'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',ed:'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',del:'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
rs:'M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z',
ph:'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z',
wa:'M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z'};
const pb=p=>p?`<a class="pb c" title="اتصال" aria-label="اتصال" href="tel:${esc(p)}">${ic(IC.ph)}</a><a class="pb w" title="واتساب" aria-label="واتساب" target="_blank" rel="noopener" href="https://wa.me/20${esc(p.replace(/^0/,''))}">${ic(IC.wa)}</a>`:'';

async function api(action,d={}){
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action,u:cred&&cred.u,p:cred&&cred.p,...d})});return await r.json()}
  catch(e){return{ok:false,msg:'تعذّر الاتصال بالإنترنت'}}
}
async function login(auto){
  if(!auto)cred={u:$('#u').value.trim(),p:$('#p').value};
  $('#lerr').textContent='جاري الدخول...';
  const r=await api('login');
  if(!r.ok){$('#lerr').textContent=r.msg;return}
  if($('#rem').checked)localStorage.setItem('ak',JSON.stringify(cred));else localStorage.removeItem('ak');
  S.me=r.user;$('#login').hidden=true;$('#app').hidden=false;
  $('#me').textContent='أهلاً '+r.user.name;$('#ulink').hidden=r.user.role!=='admin';
  load();
}
function logout(){localStorage.removeItem('ak');location.reload()}
const fixPh=p=>{p=String(p||'').replace(/\D/g,'');if(/^1\d{9}$/.test(p))p='0'+p;else if(/^201\d{9}$/.test(p))p='0'+p.slice(2);return p};
const nextNo=()=>String(Math.max(0,...S.i.map(i=>+i.no||0))+1);
async function migrate(){
  const miss=S.i.filter(i=>!i.no).sort((a,b)=>a.id.localeCompare(b.id));
  if(!miss.length)return;
  let n=Math.max(0,...S.i.map(i=>+i.no||0));
  for(const i of miss){i.no=String(++n);await api('save',{sheet:'Invoices',data:i})}
  render();
}
async function load(){
  const r=await api('list');if(!r.ok){alert(r.msg);return}
  S.t=r.traders.map(t=>({...t,phone:fixPh(t.phone)}));S.i=r.invoices.map(i=>({...i,phone:fixPh(i.phone)}));S.u=r.users;KINDS=[...new Set([...BASE,...(r.kinds||[]).map(k=>k.name).filter(Boolean)])];render();migrate();
}
function render(){
  const inv=S.i.slice().sort((a,b)=>b.date.localeCompare(a.date)||(+b.no||0)-(+a.no||0));
  const card=i=>{
    const items=JSON.parse(i.items||'[]'),paid=i.status==='paid',trashed=i.status==='deleted';
    const acts=trashed
      ?`<button class="ib o" title="استرجاع" aria-label="استرجاع" onclick="restoreInv('${i.id}')">${ic(IC.rs)}</button><button class="ib d" title="حذف نهائي" aria-label="حذف نهائي" onclick="delInv('${i.id}',true)">${ic(IC.del)}</button>`
      :`${paid?'':`<button class="ib o" title="تسديد" aria-label="تسديد" onclick="payM('${i.id}')">${ic(IC.ok)}</button><button class="ib e" title="تعديل" aria-label="تعديل" onclick="invForm('${i.id}')">${ic(IC.ed)}</button>`}<button class="ib d" title="حذف" aria-label="حذف" onclick="delInv('${i.id}')">${ic(IC.del)}</button>`;
    return `<div class="card ${trashed?'trashed':paid?'done':'open'}"><div class="no">فاتورة رقم ${esc(i.no)}</div><div class="top2"><div class="nmbox"><span class="nm">${esc(i.traderName)}</span><div class="cont">${pb(i.phone)}</div></div></div>
    <div class="act">${acts}</div>
    ${items.map(x=>`<div class="it"><span class="c">${esc(x.k)}</span>${x.n?`<span class="c">عدد ${x.n}</span>`:''}<span class="c">${fmt(x.q)} كجم</span><span class="c">× ${fmt(x.pr)} ج</span><span class="c t">${fmt(x.q*x.pr)} ج</span></div>`).join('')}
    <div class="tot"><span>الإجمالي</span><span>${fmt(num(i.total))} ج</span></div>
    <div class="mut">تاريخ الشراء: ${esc(i.date)}</div>
    ${paid&&!trashed?`<div class="paid">✓ تم التسديد بتاريخ ${esc(i.paidDate)}</div>`:''}</div>`};
  const o=inv.filter(i=>i.status!=='paid'&&i.status!=='deleted'),p=inv.filter(i=>i.status==='paid'),d=inv.filter(i=>i.status==='deleted');
  $('#open').innerHTML=o.length?o.map(card).join(''):'<div class="empty">لا توجد فواتير مفتوحة</div>';
  $('#paid').innerHTML=p.length?p.map(card).join(''):'<div class="empty">لا توجد فواتير مسددة</div>';
  $('#trash').innerHTML=d.length?d.map(card).join(''):'<div class="empty">لا توجد فواتير محذوفة</div>';
  $('#paidBtn').textContent=(secOpen.paid?'▴':'▾')+' فواتير تم سدادها'+(p.length?' ('+p.length+')':'');
  $('#trashBtn').textContent=(secOpen.trash?'▴':'▾')+' فواتير محذوفة'+(d.length?' ('+d.length+')':'');
}
const secOpen={paid:false,trash:false};
function toggleSec(k){secOpen[k]=!secOpen[k];$('#'+k+'Wrap').hidden=!secOpen[k];render()}

/* نوافذ */
function modal(html){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${html}</div>`;document.body.appendChild(o);return o}
function closeTop(){const a=document.querySelectorAll('.ov:not(.out)');if(a.length){const o=a[a.length-1];o.classList.add('out');setTimeout(()=>o.remove(),200)}}

/* تاجر */
function traderForm(after){
  modal(`<h3>تاجر جديد</h3><label>اسم التاجر</label><input id="tn"><label>رقم الهاتف</label><input id="tp" type="tel" inputmode="numeric" placeholder="01xxxxxxxxx">
  <div class="err" id="terr"></div><div class="btns"><button class="sv" onclick="saveTrader()">حفظ</button><button class="cn" onclick="closeTop()">إلغاء</button></div>`);
  window._after=after;
}
async function saveTrader(){
  const name=$('#tn').value.trim(),phone=$('#tp').value.replace(/\D/g,'');
  if(!name){$('#terr').textContent='اكتب اسم التاجر';return}
  if(!/^01\d{9}$/.test(phone)){$('#terr').textContent='رقم الهاتف لازم 11 رقم ويبدأ بـ 01';return}
  const t={id:'T'+Date.now(),name,phone};
  const r=await api('save',{sheet:'Traders',data:t});
  if(!r.ok){$('#terr').textContent=r.msg;return}
  S.t.push(t);closeTop();if(window._after)window._after(t.id);
}

/* فاتورة */
const kOpts=v=>(v&&!KINDS.includes(v)?[...KINDS,v]:KINDS).map(k=>`<option ${k===v?'selected':''}>${esc(k)}</option>`).join('')+'<option value="__new">+ إضافة صنف جديد</option>';
const rowH=(it={})=>`<div class="row"><div><label>الصنف</label><select class="k" data-p="${esc(it.k||'')}">${kOpts(it.k)}</select></div>
<div><label>العدد</label><select class="n">${Array.from({length:20},(_,i)=>`<option ${(it.n||1)==i+1?'selected':''}>${i+1}</option>`).join('')}</select></div>
<div><label>الكمية (كجم)</label><input class="q" type="number" inputmode="decimal" value="${it.q||''}"></div>
<div><label>سعر الكيلو</label><input class="pr" type="number" inputmode="decimal" value="${it.pr||''}"></div>
<div class="xw"><button class="x" aria-label="حذف الصنف" onclick="this.closest('.row').remove();calc()">${ic(IC.del)}</button></div>
<div class="ft"><span class="lt"></span></div></div>`;
function rowChg(e){
  const t=e.target;if(!t.classList.contains('k'))return;
  if(t.value!=='__new'){t.dataset.p=t.value;return}
  window._ks=t;
  modal(`<h3>صنف جديد</h3><label>اسم الصنف</label><input id="kn"><div class="err" id="kerr"></div><div class="btns"><button class="sv" onclick="saveKind()">حفظ</button><button class="cn" onclick="cancelKind()">إلغاء</button></div>`);
  setTimeout(()=>$('#kn').focus(),50);
}
function cancelKind(){const t=window._ks;t.value=t.dataset.p||KINDS[0];closeTop()}
async function saveKind(){
  const name=$('#kn').value.trim(),t=window._ks;
  if(!name){$('#kerr').textContent='اكتب اسم الصنف';return}
  if(!KINDS.includes(name)){
    const r=await api('save',{sheet:'Kinds',data:{name}});
    if(!r.ok){$('#kerr').textContent=r.msg;return}
    KINDS.push(name);
  }
  document.querySelectorAll('#rows .k').forEach(x=>{const v=x===t?name:(x.value==='__new'?(x.dataset.p||KINDS[0]):x.value);x.innerHTML=kOpts(v);x.value=v;x.dataset.p=v});
  closeTop();
}
function fillT(sel){$('#tr').innerHTML='<option value="">— اختر التاجر —</option>'+S.t.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')+'<option value="new">+ إضافة تاجر جديد</option>';if(sel)$('#tr').value=sel;showPh()}
function showPh(){const t=S.t.find(x=>x.id===$('#tr').value);$('#ph').innerHTML=t?`<b>${esc(t.phone)}</b>${pb(t.phone)}`:''}
function calc(){let g=0;document.querySelectorAll('#rows .row').forEach(r=>{const v=num(r.querySelector('.q').value)*num(r.querySelector('.pr').value);g+=v;r.querySelector('.lt').textContent='المبلغ: '+fmt(v)});$('#gt').textContent='الإجمالي: '+fmt(g)+' ج';return g}
function addRow(it){$('#rows').insertAdjacentHTML('beforeend',rowH(it));calc()}
function invForm(id){
  const inv=S.i.find(x=>x.id===id),items=inv?JSON.parse(inv.items):[{}];
  window._eid=id;
  modal(`<h3>${inv?'تعديل الفاتورة رقم '+inv.no:'فاتورة جديدة رقم '+nextNo()}</h3>
  <label>اسم التاجر</label><select id="tr" onchange="if(this.value==='new'){this.value='';traderForm(t=>fillT(t))}else showPh()"></select><div class="ph" id="ph"></div>
  <label>الأصناف</label><div id="rows" oninput="calc()" onchange="rowChg(event)"></div>
  <button class="add" onclick="addRow()">+ إضافة صنف جديد</button>
  <div class="gt" id="gt"></div><label style="text-align:center">تاريخ الشراء</label><input id="dt" type="date" value="${inv?inv.date:today()}">
  <div class="err" id="ierr"></div><div class="btns"><button class="sv" onclick="saveInv()">حفظ</button><button class="cn" onclick="closeTop()">إلغاء</button></div>`);
  fillT(inv&&inv.traderId);items.forEach(addRow);
}
async function saveInv(){
  const t=S.t.find(x=>x.id===$('#tr').value);
  if(!t){$('#ierr').textContent='اختر التاجر';return}
  const items=[...document.querySelectorAll('#rows .row')].map(r=>({k:r.querySelector('.k').value,n:+r.querySelector('.n').value,q:num(r.querySelector('.q').value),pr:num(r.querySelector('.pr').value)})).filter(x=>x.q>0);
  if(!items.length){$('#ierr').textContent='أضف صنف واحد على الأقل بالكمية';return}
  const old=S.i.find(x=>x.id===window._eid);
  const inv={id:old?old.id:'F'+Date.now(),no:old?old.no:nextNo(),traderId:t.id,traderName:t.name,phone:t.phone,date:$('#dt').value||today(),items:JSON.stringify(items),total:calc(),status:old?old.status:'open',paidDate:''};
  const r=await api('save',{sheet:'Invoices',data:inv});
  if(!r.ok){$('#ierr').textContent=r.msg;return}
  S.i=S.i.filter(x=>x.id!==inv.id).concat(inv);closeTop();render();
}
async function delInv(id,perm){
  if(!confirm(perm?'حذف الفاتورة نهائياً؟ لن تقدر تسترجعها بعد كده.':'هل تريد حذف هذه الفاتورة؟ هتقدر تسترجعها من قسم فواتير محذوفة.'))return;
  if(perm){
    const r=await api('del',{sheet:'Invoices',key:id});
    if(r.ok){S.i=S.i.filter(x=>x.id!==id);render()}else alert(r.msg);
    return;
  }
  const old=S.i.find(x=>x.id===id),n={...old,prevStatus:old.status,status:'deleted'};
  const r=await api('save',{sheet:'Invoices',data:n});
  if(r.ok){S.i=S.i.map(x=>x.id===id?n:x);render()}else alert(r.msg);
}
async function restoreInv(id){
  const old=S.i.find(x=>x.id===id),n={...old,status:old.prevStatus||'open',prevStatus:''};
  const r=await api('save',{sheet:'Invoices',data:n});
  if(r.ok){S.i=S.i.map(x=>x.id===id?n:x);render()}else alert(r.msg);
}
function payM(id){
  modal(`<h3>تسديد الفاتورة</h3><label style="text-align:center">تاريخ التسديد</label><input id="pd" type="date" value="${today()}">
  <div class="err" id="perr"></div><div class="btns"><button class="sv" onclick="pay('${id}')">تأكيد التسديد</button><button class="cn" onclick="closeTop()">إلغاء</button></div>`);
}
async function pay(id){
  const i=S.i.find(x=>x.id===id),n={...i,status:'paid',paidDate:$('#pd').value||today()};
  const r=await api('save',{sheet:'Invoices',data:n});
  if(!r.ok){$('#perr').textContent=r.msg;return}
  S.i=S.i.map(x=>x.id===id?n:x);closeTop();render();
}

/* آلة حاسبة */
let cx='';
function calcM(){cx='';const K=[['C','⌫','÷','×'],['7','8','9','−'],['4','5','6','+'],['1','2','3','='],['0','.']];
  let h='';K.flat().forEach(k=>{const c=k==='C'?'cl':'÷×−+⌫'.includes(k)?'op':k==='='?'eq':k==='0'?'z':'';h+=`<button class="${c}" onclick="ck('${k}')">${k}</button>`});
  modal(`<h3>آلة حاسبة</h3><div class="cd" id="cd">0</div><div class="ck">${h}</div><div class="btns"><button class="cn" onclick="closeTop()">إغلاق</button></div>`);
}
function ck(k){
  if(k==='C')cx='';
  else if(k==='⌫')cx=cx==='خطأ'?'':cx.slice(0,-1);
  else if(k==='='){if(!cx||cx==='خطأ')return;try{const v=Function('"use strict";return ('+cx.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')+')')();cx=isFinite(v)?String(Math.round(v*1e6)/1e6):'خطأ'}catch(e){cx='خطأ'}}
  else{if(cx==='خطأ')cx='';cx+=k}
  $('#cd').textContent=cx||'0';
}

/* المستخدمون */
function usersM(){
  modal(`<h3>المستخدمون</h3><div id="ul"></div><h3 style="font-size:20px;margin-top:16px">إضافة مستخدم</h3>
  <label>الاسم</label><input id="nn"><label>اسم الدخول</label><input id="nu"><label>كلمة السر</label><input id="np">
  <label>الصلاحية</label><select id="nr"><option value="user">مستخدم عادي</option><option value="admin">مدير</option></select>
  <div class="err" id="uerr"></div><div class="btns"><button class="sv" onclick="addUser()">إضافة</button><button class="cn" onclick="closeTop()">إغلاق</button></div>`);
  ulist();
}
function ulist(){$('#ul').innerHTML=S.u.map(u=>`<div class="ur"><span class="c n">${esc(u.name)}</span><span class="c u">${esc(u.username)}</span><span class="c ${u.role==='admin'?'m':''}">${u.role==='admin'?'مدير':'مستخدم'}</span>${u.username===cred.u?'<span class="sp"></span>':`<button class="ib d" aria-label="حذف المستخدم" onclick="delUser('${esc(u.username)}')">${ic(IC.del)}</button>`}</div>`).join('')}
async function addUser(){
  const d={name:$('#nn').value.trim(),username:$('#nu').value.trim(),password:$('#np').value,role:$('#nr').value};
  if(!d.name||!d.username||!d.password){$('#uerr').textContent='املأ كل الخانات';return}
  if(S.u.some(u=>u.username===d.username)){$('#uerr').textContent='اسم الدخول موجود قبل كده';return}
  const r=await api('save',{sheet:'Users',data:d});
  if(!r.ok){$('#uerr').textContent=r.msg;return}
  S.u.push({username:d.username,name:d.name,role:d.role});ulist();['nn','nu','np'].forEach(i=>$('#'+i).value='');$('#uerr').textContent='';
}
async function delUser(k){
  if(!confirm('حذف هذا المستخدم؟'))return;
  const r=await api('del',{sheet:'Users',key:k});
  if(r.ok){S.u=S.u.filter(u=>u.username!==k);ulist()}else alert(r.msg);
}

const saved=localStorage.getItem('ak');
if(saved){cred=JSON.parse(saved);$('#u').value=cred.u;$('#p').value=cred.p;login(true)}
</script>
